name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Reproducibility check — retrain and compare model hash
        run: |
          sha256sum models/xgb_covers.json > /tmp/before.txt
          python scripts/train.py
          sha256sum -c /tmp/before.txt || echo "::warning::model hash differs (different platform/xgboost build)"
      - run: pytest -q
